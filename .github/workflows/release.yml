name: Build & Push Docker Image

# Releases are cut by pushing a version tag.  This previously also ran on
# every push to main, which meant a full multi-arch QEMU build, cosign
# signature, SLSA attestation, and two image scans on every merge — 10 of the
# last 13 runs were main pushes publishing images nobody had asked for.
# Use workflow_dispatch for an ad-hoc build from a branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push to registries (false = build and scan only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: dougeubanks/jsm-ha-notifier
  # GHCR image — uses the GitHub username/org automatically
  GHCR_IMAGE: ${{ github.repository_owner }}/jsm-ha-notifier

jobs:
  build-and-push:
    name: Build and push to GHCR + Docker Hub
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HAS_DOCKERHUB: ${{ vars.DOCKERHUB_USERNAME != '' }}
      # True when an image is actually pushed to a registry.  Signing,
      # attestation, and registry-side steps are meaningless without a
      # published digest, so they are gated on this.
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.push_image }}

    permissions:
      contents: read
      packages: write
      security-events: write   # For uploading Trivy SARIF results
      id-token: write          # For cosign keyless signing and SLSA provenance
      attestations: write      # For GitHub build provenance attestations

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Lowercase GHCR image name
        run: echo "GHCR_IMAGE=$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Build tooling ───────────────────────────────────────────────────
      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      # ── Registry logins ─────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        # Only attempt Docker Hub login if credentials are configured.
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Metadata ────────────────────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # Release tag builds: :3.0.0
            type=semver,pattern={{version}}
            # Semver floating tags: :3  :3.0
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            # Short SHA: :abc1234 — immutable reference for rollback
            type=sha,prefix=
            # Manual dispatch builds are branch-tagged, never :latest
            type=ref,event=branch
            # :latest tracks the newest release tag (was: newest main commit)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=JSM Home Assistant Notifier
            org.opencontainers.image.description=Bridges JSM/OpsGenie alerts to Home Assistant TTS and notifications
            org.opencontainers.image.vendor=RealDougEubanks
            org.opencontainers.image.authors=RealDougEubanks
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme

      # ── Build & push ────────────────────────────────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          # arm64 is emulated through QEMU and dominates build time.  Tag
          # builds get both architectures; a manual dispatch builds amd64
          # only unless it is actually being pushed.
          platforms: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.push_image) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.push_image }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching via GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image signing with cosign (keyless / Sigstore) ──────────────────
      - name: Sign image with cosign
        if: env.PUBLISHING == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign the GHCR image digest using keyless signing (Sigstore OIDC).
          # This proves the image was built by this GitHub Actions workflow.
          cosign sign --yes \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}@${DIGEST}"

      # ── SLSA build provenance attestation ───────────────────────────────
      - name: Generate SLSA provenance attestation
        if: env.PUBLISHING == 'true'
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── Security scanning ───────────────────────────────────────────────
      # Scanners are installed directly (no third-party action) and run via
      # `env -i` so the scanner binary only sees the minimum env vars it
      # needs — preventing accidental secret exposure to scanner processes.

      - name: Install Trivy
        if: env.PUBLISHING == 'true'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner
        if: env.PUBLISHING == 'true'
        env:
          _SCAN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _SCAN_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          env -i \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            HOME="$HOME" \
            GITHUB_TOKEN="$_SCAN_TOKEN" \
            trivy image \
              --format sarif \
              --output trivy-results.sarif \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              "$_SCAN_IMAGE"
        continue-on-error: true  # Don't block release, but do report

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        if: always() && env.PUBLISHING == 'true'
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy
        continue-on-error: true

      - name: Install Grype
        if: env.PUBLISHING == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Grype vulnerability scanner
        if: env.PUBLISHING == 'true'
        env:
          _SCAN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _SCAN_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          env -i \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            HOME="$HOME" \
            GITHUB_TOKEN="$_SCAN_TOKEN" \
            grype \
              "$_SCAN_IMAGE" \
              --output sarif \
              --file grype-results.sarif \
              --only-fixed
        continue-on-error: true  # Don't block release, but do report

      - name: Upload Grype scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        if: always() && env.PUBLISHING == 'true'
        with:
          sarif_file: "grype-results.sarif"
          category: grype
        continue-on-error: true

      # ── Docker Hub README sync ───────────────────────────────────────────
      - name: Update Docker Hub repository description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: env.HAS_DOCKERHUB == 'true' && env.PUBLISHING == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: ${{ github.event.repository.description }}

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Job summary
        run: |
          echo "### Published images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Signed:** cosign keyless (Sigstore OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "**Provenance:** SLSA Build Level 2 (GitHub attestation)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp github.com/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
