---
name: CI

# Pull requests are the primary gate.  Pushes to main are also checked because
# small fixes occasionally land directly, but that run is a single-version
# smoke test rather than a second full matrix — the PR already proved the
# matrix green.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
  # Weekly dependency-vulnerability sweep: catches CVEs published against
  # already-pinned dependencies, which a per-PR scan never sees.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref.  Pushing twice to a PR cancels the superseded
# run instead of paying for both.  main is never cancelled — its runs gate
# the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_DEFAULT: "3.12"

jobs:
  # ── Static checks — Python-version independent, so run exactly once ──────
  # Previously these ran on all three matrix versions, tripling the work for
  # identical results.  Everything here is also a pre-commit hook, so on a
  # developer machine it has usually already passed before the push.
  quality:
    name: Lint, format, types, security
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github src/ tests/

      - name: Format check (black)
        run: black --check src/ tests/

      # Now blocking.  It was advisory because 15 errors were outstanding;
      # 12 were a pydantic-settings false positive (fixed by enabling the
      # pydantic mypy plugin) and 3 were real bugs, now fixed.
      - name: Type check (mypy)
        run: mypy src/

      - name: Security lint (bandit)
        run: bandit -q -r src/ -c pyproject.toml

  # ── Tests — the only genuinely version-dependent step ───────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on PRs; a single version on direct pushes to main,
        # where the PR matrix has already run.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11","3.12","3.13"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -q --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2
        if: always() && matrix.python-version == env.PYTHON_DEFAULT
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Dependency CVE scan ─────────────────────────────────────────────────
  # Only runs when dependency pins actually change, plus weekly on a
  # schedule.  A scan on a docs-only or logic-only PR re-reads the same
  # unchanged requirements file and can only fail for reasons unrelated to
  # the diff.
  audit:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: a shallow clone has no merge base with the target
          # branch, which makes the three-dot diff below fail.
          fetch-depth: 0

      - name: Check whether dependency pins changed
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # Fail SAFE, not silent: any problem determining the diff runs the
          # scan.  A security gate that skips itself while reporting green is
          # worse than one that occasionally runs when it did not need to.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a PR — running full CVE scan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! changed_files=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>&1); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not compute changed files (${changed_files}) — running CVE scan anyway."
            exit 0
          fi

          if printf '%s\n' "$changed_files" \
              | grep -qE '^(requirements.*\.txt|Dockerfile|pyproject\.toml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dependency pins changed — running CVE scan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Dependency pins unchanged — CVE scan skipped (weekly cron still covers this)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Scan runtime dependencies (pip-audit)
        if: steps.changed.outputs.run == 'true'
        run: |
          pip install -r requirements-dev.txt
          pip-audit -r requirements.txt --desc
