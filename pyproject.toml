[tool.black]
line-length = 90
target-version = ["py312"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]   # line-too-long is handled by black

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
# The pydantic plugin teaches mypy that BaseSettings subclasses populate
# their fields from the environment, so `Settings()` with no arguments is
# valid.  Without it mypy reports a false "missing named argument" for
# every required field at each construction site.
plugins = ["pydantic.mypy"]

[tool.bandit]
# B108 flags "/tmp" paths as insecure temp usage.  Here the default
# INCIDENT_DB_PATH=/tmp/incidents.db is deliberate: the container runs with a
# read-only root filesystem and /tmp is the only writable mount (a tmpfs).
# The path is operator-configurable and documented as ephemeral.
skips = ["B108"]
